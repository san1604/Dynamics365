<!DOCTYPE html>
<html>
<head>
  <title>Package Pricing</title>

  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: #f4f6f9;
      padding: 20px;
    }

    .container {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      max-width: 1000px;
      margin: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .title {
      font-size: 20px;
      font-weight:bold;
      text-align: center;
      margin-bottom: 10px;
    }

    /* 🔹 Product Summary Table */
    .package-summary {
      margin-bottom: 15px;
    }

    .package-summary table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .package-summary td {
      padding: 8px;
      border-bottom: 1px solid #eee;
    }

    .label {
      width: 150px;
      font-weight: 600;
      color: #333;
    }

    /* 🔹 Accordion */
    .accordion {
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .accordion-header {
      background: #f7f7f7;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .accordion-content {
      display: none;
      padding: 10px;
      background: #fafafa;
    }

    .accordion.active .accordion-content {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f7f7f7;
      padding: 8px;
      font-size: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    td {
      padding: 8px;
      font-size: 12px;
      border-bottom: 1px solid #eee;
    }

    .total-container {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
      font-weight: 600;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .btn-close {
      background: #1f6fb2;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body onload="init()">

<div class="container">

  <div class="title">Package Pricing</div>

  <!-- 🔹 Product Names (Clean Rows) -->
  <div class="package-summary">
    <table id="summary-table"></table>
  </div>

  <!-- MEDICAL -->
  <div class="accordion">
    <div class="accordion-header" onclick="toggle(this)">
      Medical Plan Overview<span class="arrow">▶</span>
    </div>
    <div class="accordion-content">
      <table id="medical-table"></table>
    </div>
  </div>

  <!-- RX -->
  <div class="accordion">
    <div class="accordion-header" onclick="toggle(this)">
      Rx Plan Overview<span class="arrow">▶</span>
    </div>
    <div class="accordion-content">
      <table id="rx-table"></table>
    </div>
  </div>

  <!-- DENTAL -->
  <div class="accordion">
    <div class="accordion-header" onclick="toggle(this)">
      Dental Plan Overview<span class="arrow">▶</span>
    </div>
    <div class="accordion-content">
      <table id="dental-table"></table>
    </div>
  </div>

  <!-- VISION -->
  <div class="accordion">
    <div class="accordion-header" onclick="toggle(this)">
      Vision Plan Overview<span class="arrow">▶</span>
    </div>
    <div class="accordion-content">
      <table id="vision-table"></table>
    </div>
  </div>

  <!-- PREMIUM -->
  <div class="accordion active">
    <div class="accordion-header" onclick="toggle(this)">
      Premium Overview <span class="arrow">▼</span>
    </div>
    <div class="accordion-content">
      <table id="premium-table"></table>
    </div>
  </div>

  <!-- TOTAL -->
  <div class="total-container">
    <span>Total Estimated Monthly Premium</span>
    <span id="total"></span>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button class="btn-close" onclick="closeWindow()">Close</button>
  </div>

</div>

<script>
function getParams(){
  try{
    const context = parent.Xrm.Utility.getPageContext();
    const raw = context.input.data || "";
    return new URLSearchParams(raw);
  }catch(e){
    return new URLSearchParams(window.location.search);
  }
}

function init(){
  const params = getParams();

  const formInstanceId = params.get("formInstanceId");
  const folderVersionId = params.get("folderVersionId");

  console.log("Loaded pricing for:", formInstanceId, folderVersionId);

  // 👉 call your API here later
}
// 🔹 Toggle
function toggle(el){

  const parent = el.parentElement;

  // toggle accordion
  parent.classList.toggle("active");

  // always safely get arrow
  const arrow = el.querySelector(".arrow");
  if(!arrow) return;

  // update icon AFTER toggle
  if(parent.classList.contains("active")){
    arrow.textContent = "▼";
  } else {
    arrow.textContent = "▶";
  }
}
// 🔹 Replace with PowerApps vars
const selectedProducts = {
  medical: "Gold Medical Plan",
  rx: "Standard Rx Plan",
  dental: "Basic Dental Plan",
  vision: "Vision Plus Plan"
};
// 🔹 Pagination State (NEW)
const state = {
  medical: { page: 1, size: 5 },
  rx: { page: 1, size: 5 },
  dental: { page: 1, size: 5 },
  vision: { page: 1, size: 5 }
};
// 🔹 Mock Data
const data = {
  medical: Array.from({length:10},(_,i)=>({
    MedicalCoverageLevel:"Level "+(i+1),
    NetworkTier:"INN",
    Deductible:"$500",
    Coinsurance:"20%",
    OutOfPocket:"$2000"
  })),

  rx: Array.from({length:8},(_,i)=>({
    Rx:"Tier "+(i+1),
    RxCostShare:"$"+(10*i+10)
  })),

  dental: Array.from({length:7},(_,i)=>({
    DentalCoverageLevel:"Level "+(i+1),
    NetworkTier:"INN",
    DentalDeductible:"$100",
    DentalOutofPocket:"$1000"
  })),

  vision: Array.from({length:9},(_,i)=>({
    VisionCoverageLevel:"Level "+(i+1),
    NetworkTier:"INN",
    VisionDeductible:"$50",
    VisionCoinsurance:"10%",
    VisionOutofPocket:"$500"
  })),

 premium:[
  {CoverageLevel:"Employee Only",NumberOfSubscribers:5,NumberOfMembers:5,MonthlyPremium:120},
  {CoverageLevel:"Employee + Spouse",NumberOfSubscribers:3,NumberOfMembers:6,MonthlyPremium:220},
  {CoverageLevel:"Employee + Child",NumberOfSubscribers:4,NumberOfMembers:10,MonthlyPremium:210},
  {CoverageLevel:"Family",NumberOfSubscribers:2,NumberOfMembers:8,MonthlyPremium:300},
  {CoverageLevel:"Executive Plan",NumberOfSubscribers:1,NumberOfMembers:3,MonthlyPremium:450}
],  

  total:300
};
// 🔹 INIT
function init(){
  renderSummary();
  renderMedical();
  renderRx();
  renderDental();
  renderVision();
  renderPremium();
  setTotal(calculateTotalPremium());
  document.querySelectorAll(".accordion").forEach(acc => {
  const arrow = acc.querySelector(".arrow");
  if(!arrow) return;

  if(acc.classList.contains("active")){
    arrow.textContent = "▼";
  } else {
    arrow.textContent = "▶";
  }
});
}

// 🔹 Summary (ONE ROW PER PRODUCT)
function renderSummary(){
  const rows = [];

  if(selectedProducts.medical){
    rows.push(`<tr><td class="label">Medical</td><td>${selectedProducts.medical}</td></tr>`);
  }
  if(selectedProducts.rx){
    rows.push(`<tr><td class="label">Rx</td><td>${selectedProducts.rx}</td></tr>`);
  }
  if(selectedProducts.dental){
    rows.push(`<tr><td class="label">Dental</td><td>${selectedProducts.dental}</td></tr>`);
  }
  if(selectedProducts.vision){
    rows.push(`<tr><td class="label">Vision</td><td>${selectedProducts.vision}</td></tr>`);
  }

  document.getElementById("summary-table").innerHTML = rows.join("");
}

// 🔹 Render tables (same as before)

function renderMedical(){

  const s = state.medical;
  const list = data.medical;

  const start = (s.page-1)*s.size;
  const rows = list.slice(start,start+s.size);

  document.getElementById("medical-table").innerHTML=`
    <tr><th>Coverage</th><th>Network</th><th>Deductible</th><th>Coinsurance</th><th>Out of Pocket</th></tr>
    ${rows.map(r=>`
      <tr>
        <td>${r.MedicalCoverageLevel}</td>
        <td>${r.NetworkTier}</td>
        <td>${r.Deductible}</td>
        <td>${r.Coinsurance}</td>
        <td>${r.OutOfPocket}</td>
      </tr>`).join("")}
  `;

  renderPager("medical", list.length);
}

function renderRx(){

  const s = state.rx;
  const list = data.rx;

  const start = (s.page-1)*s.size;
  const rows = list.slice(start,start+s.size);

  document.getElementById("rx-table").innerHTML=`
    <tr><th>Rx Tier</th><th>Cost Share</th></tr>
    ${rows.map(r=>`
      <tr>
        <td>${r.Rx}</td>
        <td>${r.RxCostShare}</td>
      </tr>`).join("")}
  `;

  renderPager("rx", list.length);
}

function renderDental(){

  const s = state.dental;
  const list = data.dental;

  const start = (s.page-1)*s.size;
  const rows = list.slice(start,start+s.size);

  document.getElementById("dental-table").innerHTML=`
    <tr><th>Coverage</th><th>Network</th><th>Deductible</th><th>Out of Pocket</th></tr>
    ${rows.map(r=>`
      <tr>
        <td>${r.DentalCoverageLevel}</td>
        <td>${r.NetworkTier}</td>
        <td>${r.DentalDeductible}</td>
        <td>${r.DentalOutofPocket}</td>
      </tr>`).join("")}
  `;

  renderPager("dental", list.length);
}
function renderVision(){

  const s = state.vision;
  const list = data.vision;

  const start = (s.page-1)*s.size;
  const rows = list.slice(start,start+s.size);

  document.getElementById("vision-table").innerHTML=`
    <tr><th>Coverage</th><th>Network</th><th>Deductible</th><th>Coinsurance</th><th>Out of Pocket</th></tr>
    ${rows.map(r=>`
      <tr>
        <td>${r.VisionCoverageLevel}</td>
        <td>${r.NetworkTier}</td>
        <td>${r.VisionDeductible}</td>
        <td>${r.VisionCoinsurance}</td>
        <td>${r.VisionOutofPocket}</td>
      </tr>`).join("")}
  `;

  renderPager("vision", list.length);
}
function renderPremium(){
  document.getElementById("premium-table").innerHTML=`
    <tr><th>Coverage</th><th>Subscribers</th><th>Members</th><th>Monthly Premium</th></tr>
    ${data.premium.map(p=>`
      <tr>
        <td>${p.CoverageLevel}</td>
        <td>${p.NumberOfSubscribers}</td>
        <td>${p.NumberOfMembers}</td>
        <td>$${p.MonthlyPremium}</td>
      </tr>`).join("")}
  `;
}

function setTotal(val){
  document.getElementById("total").innerText="$"+Number(val).toLocaleString();
}

function closeWindow(){
  if(parent && parent.Xrm){
    parent.Xrm.Navigation.closeDialog();
  }
}
function renderPager(type, total){

  const s = state[type];
  const start = (s.page-1)*s.size+1;
  const end = Math.min(s.page*s.size,total);

  const containerId = type + "-pager";

  let el = document.getElementById(containerId);

  if(!el){
    const div = document.createElement("div");
    div.id = containerId;
    div.style.display = "flex";
    div.style.justifyContent = "space-between";
    div.style.alignItems = "center";
    div.style.fontSize = "12px";
    div.style.marginTop = "6px";
    document.getElementById(type+"-table").after(div);
    el = div;
  }

  el.innerHTML = `
    <div>
      Per Page 
        <select onchange="changePageSize('${type}', this.value)">
        <option ${s.size==5?'selected':''}>5</option>
        <option ${s.size==10?'selected':''}>10</option>
        <option ${s.size==20?'selected':''}>20</option>
        </select>
    </div>

    <div>${start} to ${end} of ${total}</div>

    <div>
      <button onclick="prevPage('${type}')">«</button>
      <button onclick="nextPage('${type}')">»</button>
    </div>
  `;
}
function calculateTotalPremium(){
  return data.premium.reduce((sum, item) => {
    return sum + Number(item.MonthlyPremium || 0);
  }, 0);
}
function nextPage(type){
  const s = state[type];
  if(s.page*s.size < data[type].length){
    s.page++;
    init();
  }
}

function prevPage(type){
  const s = state[type];
  if(s.page > 1){
    s.page--;
    init();
  }
}
function changePageSize(type, size){
  state[type].size = parseInt(size);
  state[type].page = 1; // reset page
  init();
}

</script>

</body>
</html>
