<!DOCTYPE html>
<html>
<head>
  <title>Pricing</title>
  <style>
    body { font-family: Segoe UI; padding:20px; }
    table { width:100%; border-collapse: collapse; }
    td, th { border:1px solid #ddd; padding:8px; }
  </style>
</head>

<body onload="init()">

<h2 id="title"></h2>

<div id="content"></div>

<script>
function getData(){
  try{
    const context = parent.Xrm.Utility.getPageContext();
    const raw = context.input.data;
    return JSON.parse(decodeURIComponent(raw));
  }catch(e){
    console.error(e);
    return null;
  }
}

function parseJsonList(json){
  try{
    return JSON.parse(json || "[]");
  }catch{
    return [];
  }
}

function init(){
  const item = getData();

  if(!item){
    document.body.innerHTML = "No data received";
    return;
  }

  const type = (item.FormInstanceType || "").toLowerCase();

  document.getElementById("title").innerText = type.toUpperCase() + " PRICING";

  if(type === "medical"){
    renderMedical(item);
  }
  else if(type === "dental"){
    renderDental(item);
  }
  else if(type === "vision"){
    renderVision(item);
  }
  else if(type === "rx"){
    renderRx(item);
  }
  else if(type === "package"){
    renderPackage(item);
  }
}

function renderMedical(item){
  const list = parseJsonList(item.PlanOverViewList?.[0]?.PlanOverViewList);

  let html = "<table><tr><th>Coverage</th><th>Network</th><th>Deductible</th></tr>";

  list.forEach(p=>{
    html += `
      <tr>
        <td>${p.MedicalCoverageLevel}</td>
        <td>${p.NetworkTier}</td>
        <td>${p.MedicalDeductible}</td>
      </tr>`;
  });

  html += "</table>";

  document.getElementById("content").innerHTML = html;
}

function renderDental(item){
  document.getElementById("content").innerHTML = "Dental pricing here";
}

function renderVision(item){
  document.getElementById("content").innerHTML = "Vision pricing here";
}

function renderRx(item){
  document.getElementById("content").innerHTML = "Rx pricing here";
}

function renderPackage(item){
  document.getElementById("content").innerHTML = "Package pricing here";
}
</script>

</body>
</html>
