<!DOCTYPE html>
<html>
<head>
  <title>Medical Pricing</title>

  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: #f4f6f9;
      padding: 20px;
    }

    .container {
      background: #fff;
      padding: 20px;
      border-radius: 6px;
      max-width: 900px;
      margin: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .heading {
      font-weight:600;
    }

    .title {
      font-size: 20px;
      font-weight:bold;
      margin-bottom: 15px;
      text-align: center;
    }

    .section {
      margin-top: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f7f7f7;
      padding: 8px;
      font-size: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    td {
      padding: 8px;
      font-size: 12px;
      border-bottom: 1px solid #eee;
    }

    .pagination-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
    }

    .pager button {
      border: 1px solid #ccc;
      background: white;
      padding: 3px 8px;
      margin-left: 5px;
      cursor: pointer;
    }

    .total-container {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
      font-weight: 600;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .btn-close {
      background: #1f6fb2;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body onload="init()">

<div class="container">

  <div class="title">Medical Pricing</div>

  <!-- PLAN OVERVIEW -->
  <span class="heading">Plan Overview</span>
  <div class="section">
    
    <table id="plan-table"></table>

    <div class="pagination-bar">
      <div>
        Per Page 
        <select onchange="changePageSize(this.value)">
          <option selected>5</option>
          <option>10</option>
          <option>20</option>
        </select>
      </div>

      <div id="page-info"></div>

      <div class="pager">
        <button onclick="prev()">«</button>
        <button onclick="next()">»</button>
      </div>
    </div>
  </div>

  <!-- PREMIUM OVERVIEW -->
  <div class="section">
    <table id="premium-table"></table>
  </div>

  <!-- TOTAL -->
  <div class="total-container">
    <span>Total Estimated Monthly Premium</span>
    <span id="total"></span>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button class="btn-close" onclick="closeWindow()">Close</button>
  </div>

</div>

<script>

// 🔹 State
let page = 1;
let pageSize = 5;

// 🔹 MOCK DATA (replace with PowerApps data)
const data = {
  PlanOverViewList: Array.from({length:12},(_,i)=>({
    MedicalCoverageLevel:"Level "+(i+1),
    NetworkTier:"INN",
    MedicalDeductible:"$500",
    MedicalCoinsurance:"20%",
    MedicalOutofPocket:"$2000"
  })),

  PremiumsOverviewList:[
    {CoverageLevel:"Emp Only",NumberOfSubscribers:1,NumberOfMembers:1,MonthlyPremium:117},
    {CoverageLevel:"Emp + Spouse",NumberOfSubscribers:2,NumberOfMembers:2,MonthlyPremium:200},
    {CoverageLevel:"Emp + Child",NumberOfSubscribers:2,NumberOfMembers:3,MonthlyPremium:210},
    {CoverageLevel:"Family",NumberOfSubscribers:2,NumberOfMembers:4,MonthlyPremium:300}
  ],

  TotalEstimatedMonthlyPremium:827
};

// 🔹 Init
function init(){
  renderPlan();
  renderPremium();
  setTotal(data.TotalEstimatedMonthlyPremium);
}

// 🔹 PLAN TABLE (MEDICAL MAPPING)
function renderPlan(){
  const start = (page-1)*pageSize;
  const rows = data.PlanOverViewList.slice(start,start+pageSize);

  document.getElementById("plan-table").innerHTML=`
    <tr>
      <th>Coverage</th>
      <th>Network</th>
      <th>Deductible</th>
      <th>Coinsurance</th>
      <th>Out of Pocket</th>
    </tr>

    ${rows.map(r=>`
      <tr>
        <td>${r.MedicalCoverageLevel}</td>
        <td>${r.NetworkTier}</td>
        <td>${r.MedicalDeductible}</td>
        <td>${r.MedicalCoinsurance}</td>
        <td>${r.MedicalOutofPocket}</td>
      </tr>
    `).join("")}
  `;

  updatePageInfo();
}

// 🔹 PAGINATION
function updatePageInfo(){
  const total = data.PlanOverViewList.length;
  const start = (page-1)*pageSize+1;
  const end = Math.min(page*pageSize,total);

  document.getElementById("page-info").innerText =
    `${start} to ${end} of ${total} | Page ${page} of ${Math.ceil(total/pageSize)}`;
}

function next(){
  if(page*pageSize < data.PlanOverViewList.length){
    page++;
    renderPlan();
  }
}

function prev(){
  if(page > 1){
    page--;
    renderPlan();
  }
}

function changePageSize(size){
  pageSize = parseInt(size);
  page = 1;
  renderPlan();
}

// 🔹 PREMIUM TABLE
function renderPremium(){
  document.getElementById("premium-table").innerHTML=`
    <tr>
      <th>Coverage</th>
      <th>Subscribers</th>
      <th>Members</th>
      <th>Monthly Premium</th>
    </tr>

    ${data.PremiumsOverviewList.map(p=>`
      <tr>
        <td>${p.CoverageLevel}</td>
        <td>${p.NumberOfSubscribers}</td>
        <td>${p.NumberOfMembers}</td>
        <td>$${p.MonthlyPremium}</td>
      </tr>
    `).join("")}
  `;
}

// 🔹 TOTAL
function setTotal(val){
  document.getElementById("total").innerText = "$"+Number(val).toLocaleString();
}

// 🔹 CLOSE
function closeWindow(){
  if(parent && parent.Xrm){
    parent.Xrm.Navigation.closeDialog();
  }
}

</script>

</body>
</html>
